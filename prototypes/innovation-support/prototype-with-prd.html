/** 4. 表格排序 */
function sortTable(pageKey, columnKey) {
    if (!state.sortConfig[pageKey]) state.sortConfig[pageKey] = {};
    const cfg = state.sortConfig[pageKey];
    if (cfg.column !== columnKey) {
        cfg.column = columnKey;
        cfg.order = 'asc';
    } else if (cfg.order === 'asc') {
        cfg.order = 'desc';
    } else if (cfg.order === 'desc') {
        cfg.column = null;
        cfg.order = null;
    }

    // 重新渲染表格（支持 tab-table）
    const resolved = resolvePageConfig(pageKey);
    const config = resolved ? resolved.config : pageConfigs[pageKey];
    if (pageKey === 'admin-auth') {
        renderAdminAuthTable();
        // 更新分页
        const data = getTabData('admin-auth', state.currentTab['admin-auth']);
        const pagiContainer = $('mainContent').querySelector('.flex.flex-wrap.items-center.justify-between');
        if (pagiContainer) pagiContainer.outerHTML = renderPagination('admin-auth', data.length);
    } else if (config && config.type === 'tree') {
        renderTreeTable(pageKey);
    } else if (config && config.type === 'menu') {
        renderMenuTable();
    } else if (resolved && resolved.tabKey) {
        // tab-table 页面
        const cols = resolved.columns || [];
        const data = resolved.getData();
        // 对数据排序
        const cfg = state.sortConfig[pageKey];
        if (cfg.column && cfg.order) {
            data.sort(function(a, b) {
                var va = a[cfg.column] !== undefined ? a[cfg.column] : '';
                var vb = b[cfg.column] !== undefined ? b[cfg.column] : '';
                if (typeof va === 'number' && typeof vb === 'number') {
                    return cfg.order === 'asc' ? va - vb : vb - va;
                }
                return cfg.order === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
            });
        }

/** 查询 */
function handleQuery(pageKey) {
    // 检测是否为 tab-table 格式（key 包含下划线分隔的 tabKey）
    let realPageKey = pageKey;
    let tabKey = null;
    let config = pageConfigs[pageKey];
    let queryFields = config ? config.query : null;
    
    // 如果直接找不到，尝试解析 pageKey_tabKey 格式
    if (!config) {
        for (const pk of Object.keys(pageConfigs)) {
            if (pageKey.startsWith(pk + '_')) {
                realPageKey = pk;
                tabKey = pageKey.substring(pk.length + 1);
                config = pageConfigs[pk];
                if (config.tabConfigs && config.tabConfigs[tabKey]) {
                    queryFields = config.tabConfigs[tabKey].query;
                }
                break;
            }
        }
    }
    
    if (!queryFields) return;
    
    if (!state.searchData[pageKey]) state.searchData[pageKey] = {};
    for (const field of queryFields) {
        const el = $('query_' + pageKey + '_' + field.key);
        if (el) state.searchData[pageKey][field.key] = el.value;
    }
    // 重置页码
    state.pagination[pageKey] = { page: 1, pageSize: 10 };
    
    // 重新渲染
    if (realPageKey === 'admin-auth') {
        renderAdminAuthTable();
    } else if (tabKey && config && config.tabConfigs && config.tabConfigs[tabKey]) {
        // tab-table 页面
        const tabCfg = config.tabConfigs[tabKey];
        const data = getTabData(realPageKey, tabKey);
        // 对数据做过滤
        const search = state.searchData[pageKey];
        let filtered = data.slice();
        if (search) {
            for (const [key, val] of Object.entries(search)) {
                if (val && val.trim()) {
                    filtered = filtered.filter(row => String(row[key] !== undefined ? row[key] : '').toLowerCase().includes(val.toLowerCase()));
                }
            }
        }
        renderTable('tableContainer_' + pageKey, tabCfg.columns, filtered, pageKey);
        // 更新分页
        const main = $('mainContent');
        const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, filtered.length);
    } else {
        renderTable('tableContainer_' + pageKey, config.columns, getPageData(pageKey), pageKey);
        const data = getPageData(pageKey);
        const main = $('mainContent');
        const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4.mt-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, data.length);
    }
    showToast('查询完成', 'info');
}

/** 重置 */
function handleReset(pageKey) {
    const config = pageConfigs[pageKey];
    if (!config.query) return;
    state.searchData[pageKey] = {};
    for (const field of config.query) {
        const el = $('query_' + pageKey + '_' + field.key);
        if (el) el.value = '';
    }
    state.pagination[pageKey] = { page: 1, pageSize: 10 };
    if (pageKey === 'admin-auth') {
        renderAdminAuthTable();
    } else {
        renderTable('tableContainer_' + pageKey, config.columns, getPageData(pageKey), pageKey);
        const data = getPageData(pageKey);
        const main = $('mainContent');
        const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4.mt-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, data.length);
    }
    showToast('已重置', 'info');
}

/** 跳转页码 */
function goToPage(pageKey, page) {
    if (!state.pagination[pageKey]) state.pagination[pageKey] = { page: 1, pageSize: 10 };
    state.pagination[pageKey].page = page;
    const resolved = resolvePageConfig(pageKey);
    const config = resolved ? resolved.config : pageConfigs[pageKey];
    const pageSize = state.pagination[pageKey].pageSize;
    const start = (page - 1) * pageSize;
    
    if (pageKey === 'admin-auth') {
        renderAdminAuthTable();
    } else if (resolved && resolved.tabKey) {
        const cols = resolved.columns || [];
        let data = resolved.getData();
        // 排序
        const sc = state.sortConfig[pageKey];
        if (sc && sc.column && sc.order) {
            data = data.slice().sort(function(a, b) {
                var va = a[sc.column] !== undefined ? a[sc.column] : '';
                var vb = b[sc.column] !== undefined ? b[sc.column] : '';
                if (typeof va === 'number' && typeof vb === 'number') {
                    return sc.order === 'asc' ? va - vb : vb - va;
                }
                return sc.order === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
            });
        }
        // 查询过滤
        const search = state.searchData[pageKey];
        if (search) {
            for (var k in search) {
                if (search[k] && search[k].trim()) {
                    data = data.filter(function(row) {
                        return String(row[k] !== undefined ? row[k] : '').toLowerCase().includes(search[k].toLowerCase());
                    });
                }
            }
        }
        renderTable('tableContainer_' + pageKey, cols, data.slice(start, start + pageSize), pageKey);
    } else {
        renderTable('tableContainer_' + pageKey, config.columns, getPageData(pageKey), pageKey);
    }
    const main = $('mainContent');
    const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4');
    if (oldPagi) {
        const totalData = resolved && resolved.tabKey ? resolved.getData() : getPageData(pageKey);
        oldPagi.outerHTML = renderPagination(pageKey, totalData.length);
    }
}

/** 修改每页条数 */
function changePageSize(pageKey, size) {
    if (!state.pagination[pageKey]) state.pagination[pageKey] = { page: 1, pageSize: 10 };
    state.pagination[pageKey].pageSize = parseInt(size);
    state.pagination[pageKey].page = 1;
    goToPage(pageKey, 1);
}

function handleAction(actionKey, pageKey, rowId) {
    switch (actionKey) {
        case 'edit': openEditModal(pageKey, rowId); break;
        case 'delete': openDeleteConfirm(pageKey, rowId); break;

        case 'batchView': openLineBatchView(); break;

/** 6. 通用弹窗打开 */
var modalZIndex = 1000;
function openModal(id, title, bodyHtml, footerHtml, size) {
    // 移除已存在的同名弹窗
    closeModal(id);
    const sizes = { small: '420px', normal: '560px', large: '800px', xlarge: '1000px' };
    const width = sizes[size] || sizes.normal;
    modalZIndex += 10;
    var currentZ = modalZIndex;
    const modal = document.createElement('div');
    modal.className = 'modal-mask show';
    modal.id = id;
    modal.style.zIndex = currentZ;
    modal.innerHTML = `
        <div class="modal-box" style="width:${width};max-width:95%;z-index:${currentZ + 1};">
            <div class="modal-header">
                <span class="font-medium" style="font-size:16px;">${title}</span>
                <i class="fa fa-times cursor-pointer" style="color:#999;" onclick="closeModal('${id}')"></i>
            </div>
            <div class="modal-body">${bodyHtml}</div>
            ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
        </div>
    `;
    // 点击遮罩关闭
    modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal(id);
    });
    $('modalLayer').appendChild(modal);
}

/** 6. 通用弹窗关闭 */
function closeModal(id) {
    const modal = $(id);
    if (modal) modal.remove();
}

/** 通用右侧抽屉打开 */
function openDrawer(id, title, bodyHtml, footerHtml, width) {
    closeDrawer(id);
    var drawerWidth = width || '720px';
    modalZIndex += 10;
    var currentZ = modalZIndex;

    // 遮罩层
    var mask = document.createElement('div');
    mask.className = 'drawer-mask show';
    mask.id = 'mask_' + id;
    mask.style.zIndex = currentZ;
    mask.addEventListener('click', function() { closeDrawer(id); });

    // 抽屉
    var drawer = document.createElement('div');
    drawer.className = 'drawer show';
    drawer.id = id;
    drawer.style.zIndex = currentZ + 1;
    drawer.style.width = drawerWidth;
    drawer.innerHTML = `
        <div class="drawer-header">
            <span class="drawer-title">${title}</span>
            <div class="drawer-close" onclick="closeDrawer('${id}')"><i class="fa fa-times"></i></div>
        </div>
        <div class="drawer-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="drawer-footer">${footerHtml}</div>` : ''}
    `;

    $('modalLayer').appendChild(mask);
    $('modalLayer').appendChild(drawer);
}

/** 通用右侧抽屉关闭 */
function closeDrawer(id) {
    var drawer = $(id);
    var mask = $('mask_' + id);
    if (drawer) drawer.remove();
    if (mask) mask.remove();
}

/** 获取当前时间字符串 */
function formatNow() {
    var d = new Date();
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

/** 确认新增 — 读取表单值并添加到数据 */
function confirmAdd(pageKey, modalId) {
    const resolved = resolvePageConfig(pageKey);
    if (!resolved) { closeModal(modalId); showToast('页面配置不存在', 'error'); return; }
    const config = resolved.config;
    const modal = document.getElementById(modalId);
    if (!modal) { closeModal(modalId); showToast('新增成功', 'success'); renderPage(resolved.pageKey); return; }
    
    // 创建新行数据
    var newRow = { id: Date.now() };
    
    // 读取 input/select/textarea 值（排除 radio）
    modal.querySelectorAll('input[id^="add_"], select[id^="add_"], textarea[id^="add_"]').forEach(function(input) {
        if (input.type === 'radio') return;
        var key = input.id.replace('add_', '');
        newRow[key] = input.value;
    });
    
    // 读取选中的 radio
    var checkedRadio = modal.querySelector('input[type="radio"]:checked');
    if (checkedRadio && checkedRadio.name) {
        newRow[checkedRadio.name] = checkedRadio.value;
    }
    
    // 读取 toggle 开关状态
    modal.querySelectorAll('.toggle-switch[id^="add_"]').forEach(function(toggle) {
        var key = toggle.id.replace('add_', '');
        newRow[key] = toggle.classList.contains('on');
    });
    
    // 补充创建时间
    newRow.createTime = formatNow();
    
    // 添加到数据数组（支持 tab-table）
    if (resolved.tabKey) {
        var data = resolved.getData();
        resolved.setData([newRow].concat(data));
        // 重新渲染当前tab表格
        var cols = resolved.columns || [];
        var pageSize = state.pagination[pageKey] ? state.pagination[pageKey].pageSize : 10;
        renderTable('tableContainer_' + pageKey, cols, [newRow].concat(data).slice(0, pageSize), pageKey);
        var main = $('mainContent');
        var oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, [newRow].concat(data).length);
        if (state.selectedRows[pageKey]) state.selectedRows[pageKey].clear();
    } else {
        if (!config.data) config.data = [];
        config.data.unshift(newRow);
        renderPage(pageKey);
    }
    
    closeModal(modalId);
    showToast('新增成功', 'success');
}

/** 编辑弹窗 */
function openEditModal(pageKey, rowId) {
    const resolved = resolvePageConfig(pageKey);
    if (!resolved) { showToast('页面配置不存在', 'error'); return; }
    
    const data = resolved.getData();
    const row = data.find(r => r.id === rowId);
    if (!row) return;
    
    const id = 'modal_edit_' + pageKey;
    const cols = resolved.columns || [];
    let body = '';
    
    // tab-table 页面：根据 columns 动态生成编辑表单
    if (resolved.tabKey) {
        for (const col of cols) {
            if (col.type === 'checkbox' || col.type === 'index' || col.type === 'actions') continue;
            const fieldKey = col.key;
            const fieldLabel = col.title || col.key;
            const isRequired = col.required !== false;
            const val = row[fieldKey] !== undefined ? row[fieldKey] : '';
            let inputHtml = '';
            
            if (col.formType === 'select' || col.options) {
                const opts = col.options || [];
                let optionsHtml = '<option value="">请选择</option>';
                for (const opt of opts) {
                    const v = typeof opt === 'object' ? opt.value : opt;
                    const l = typeof opt === 'object' ? opt.label : opt;
                    optionsHtml += '<option value="' + v + '" ' + (String(val) === String(v) ? 'selected' : '') + '>' + l + '</option>';
                }
                inputHtml = '<select class="form-input w-full" id="edit_' + fieldKey + '">' + optionsHtml + '</select>';
            } else if (col.formType === 'textarea') {
                inputHtml = '<textarea class="form-input w-full" id="edit_' + fieldKey + '" rows="3">' + esc(String(val)) + '</textarea>';
            } else if (col.key === 'status') {
                inputHtml = '<span class="toggle-switch ' + (val ? 'on' : '') + '" id="edit_status" onclick="this.classList.toggle(\x27on\x27)"></span>';
            } else if (col.key === 'sortNo' || col.type === 'number') {
                inputHtml = '<input type="number" class="form-input" id="edit_' + fieldKey + '" style="width:150px;" value="' + val + '" min="1" />';
            } else if (col.key === 'createTime' || col.key === 'updateTime' || col.key === 'approveTime' || col.key === 'submitTime') {
                continue;
            } else {
                inputHtml = '<input type="text" class="form-input w-full" id="edit_' + fieldKey + '" value="' + esc(String(val)) + '" />';

/** 确认编辑 */
/** 确认编辑 — 读取表单值并更新数据 */
function confirmEdit(pageKey, modalId, rowId) {
    const resolved = resolvePageConfig(pageKey);
    if (!resolved) { closeModal(modalId); showToast('页面配置不存在', 'error'); return; }
    const config = resolved.config;
    const modal = document.getElementById(modalId);
    if (!modal) { closeModal(modalId); showToast('编辑成功', 'success'); renderPage(resolved.pageKey); return; }
    
    // 找到要编辑的行
    var data = resolved.getData();
    var idx = data.findIndex(function(r) { return r.id === rowId; });
    if (idx === -1) { closeModal(modalId); return; }
    var row = data[idx];
    
    // 读取 input/select/textarea 值（tab-table用 edit_ 前缀，原有页面用 add_ 前缀）
    var prefix = resolved.tabKey ? 'edit_' : 'add_';
    modal.querySelectorAll('input[id^="' + prefix + '"], select[id^="' + prefix + '"], textarea[id^="' + prefix + '"]').forEach(function(input) {
        if (input.type === 'radio') return;
        var key = input.id.replace(prefix, '');
        if (input.value !== undefined && input.value !== '') {
            row[key] = input.value;
        }
    });
    
    // 读取选中的 radio
    var checkedRadio = modal.querySelector('input[type="radio"]:checked');
    if (checkedRadio && checkedRadio.name) {
        row[checkedRadio.name] = checkedRadio.value;
    }
    
    // 读取 toggle 开关状态
    modal.querySelectorAll('.toggle-switch[id^="' + prefix + '"]').forEach(function(toggle) {
        var key = toggle.id.replace(prefix, '');
        row[key] = toggle.classList.contains('on');
    });
    
    // 更新时间
    if (row.updateTime !== undefined) row.updateTime = formatNow();
    
    // 保存并刷新（支持 tab-table）
    if (resolved.tabKey) {
        resolved.setData(data);
        var cols = resolved.columns || [];
        var pageSize = state.pagination[pageKey] ? state.pagination[pageKey].pageSize : 10;
        var pageNum = state.pagination[pageKey] ? state.pagination[pageKey].page : 1;
        var start = (pageNum - 1) * pageSize;
        renderTable('tableContainer_' + pageKey, cols, data.slice(start, start + pageSize), pageKey);
    } else {
        renderPage(resolved.pageKey);
    }
    
    closeModal(modalId);
    showToast('编辑成功', 'success');
}

/** 显示机构下拉列表 */
function showDeputyOrgList() {
    var dropdown = document.getElementById('deputy_orgDropdown');
    if (dropdown) dropdown.style.display = 'block';
    filterDeputyOrgList(document.getElementById('deputy_orgName').value);
}

/** 延迟隐藏机构下拉列表（允许点击选择） */
function hideDeputyOrgListDelayed() {
    setTimeout(function() {
        var dropdown = document.getElementById('deputy_orgDropdown');
        if (dropdown) dropdown.style.display = 'none';
    }, 200);
}

/** 过滤机构下拉列表 */
function filterDeputyOrgList(keyword) {
    var dropdown = document.getElementById('deputy_orgDropdown');
    var list = document.getElementById('deputy_orgList');
    if (!dropdown || !list) return;
    dropdown.style.display = 'block';
    var items = list.querySelectorAll('.deputy-org-item');
    var kw = keyword.toLowerCase();
    for (var i = 0; i < items.length; i++) {
        var name = items[i].getAttribute('data-name') || '';
        if (name.toLowerCase().indexOf(kw) >= 0) {
            items[i].style.display = '';
        } else {
            items[i].style.display = 'none';
        }
    }
}

/** 选择机构 */
function selectDeputyOrg(orgName) {
    var input = document.getElementById('deputy_orgName');
    if (input) input.value = orgName;
    var dropdown = document.getElementById('deputy_orgDropdown');
    if (dropdown) dropdown.style.display = 'none';
    showToast('已选择：' + orgName, 'info');
}

/** 确认添加副职 */
function confirmAddDeputyDuty(modalId, viewModalId) {
    var dutyName = document.getElementById('deputy_dutyName').value;
    if (!dutyName || !dutyName.trim()) {
        showToast('请输入职务名称', 'warning');
        return;
    }
    closeModal(modalId);
    showToast('副职任职添加成功', 'success');
}

/** 确认编辑任职 */
function confirmEditPost(userId, postId, modalId) {
    var org = document.getElementById('editPost_org').value;
    if (!org) {
        showToast('请选择所属机构', 'warning');
        return;
    }
    var postType = document.getElementById('editPost_type').value;
    if (postType === 'part') {
        var partType = document.getElementById('editPost_partTimeType').value;
        if (!partType) {
            showToast('请选择兼职方式', 'warning');
            return;
        }
    }
    var duty = document.getElementById('editPost_duty').value;
    var appointDate = document.getElementById('editPost_date').value;
    var appointDoc = document.getElementById('editPost_doc').value;

    var posts = userLayoutState.userPosts[userId] || [];
    for (var i = 0; i < posts.length; i++) {
        if (posts[i].id === postId) {
            posts[i].orgName = org;
            posts[i].postType = postType;
            posts[i].isMain = postType === 'main';
            posts[i].partTimeType = postType === 'part' ? partType : '';
            posts[i].duty = duty;
            posts[i].appointDate = appointDate;
            posts[i].appointDoc = appointDoc;
            // 如果设为主职，取消其他主职
            if (postType === 'main') {
                for (var j = 0; j < posts.length; j++) {
                    if (j !== i && posts[j].isMain) {
                        posts[j].isMain = false;
                        posts[j].postType = 'part';
                    }
                }
            }
            break;
        }
    }

    closeModal(modalId);
    showToast('任职信息修改成功', 'success');
    refreshPostList(userId);
}

/** 确认添加任职 */
function confirmAddPost(modalId, userId) {
    var org = document.getElementById('addPost_org').value;
    if (!org) {
        showToast('请选择所属机构', 'warning');
        return;
    }
    var postType = document.getElementById('addPost_type').value;
    var partType = '';
    if (postType === 'part') {
        partType = document.getElementById('addPost_partTimeType').value;
        if (!partType) {
            showToast('请选择兼职方式', 'warning');
            return;
        }
    }
    var duty = document.getElementById('addPost_duty').value;

    // 添加到任职数据
    if (!userLayoutState.userPosts[userId]) {
        userLayoutState.userPosts[userId] = [];
    }
    var posts = userLayoutState.userPosts[userId];
    var newId = Math.max(0, posts.map(function(p) { return p.id; }).reduce(function(a, b) { return Math.max(a, b); }, 0)) + 1;

    var isMain = postType === 'main';
    // 如果设为主职，取消现有主职
    if (isMain) {
        for (var i = 0; i < posts.length; i++) {
            if (posts[i].isMain) {
                posts[i].isMain = false;
                posts[i].postType = 'part';
            }
        }
    }

    var orgFullPath = '赣政通/省属企业/江西某科技公司/' + org;
    posts.push({
        id: newId,
        orgId: 'dept_' + org,
        orgName: org,
        orgFullPath: orgFullPath,
        postType: postType,
        partTimeType: partType,
        duty: duty || '',
        isMain: isMain,
        appointDate: new Date().toISOString().split('T')[0],
        appointDoc: ''
    });

    closeModal(modalId);
    showToast('任职添加成功', 'success');
    // 刷新列表
    refreshPostList(userId);
}

/** 子表格渲染（用户详情Tab内使用） */
function renderSubTable(data, columns, tableId, batchBtnText, showBatch) {
    var html = '';
    if (!data || !Array.isArray(data) || data.length === 0) {
        return '<div style="padding:24px;text-align:center;color:var(--text-tertiary);">暂无数据</div>';
    }
    if (!columns || !Array.isArray(columns)) {
        return '<div style="padding:24px;text-align:center;color:var(--text-tertiary);">列配置异常</div>';
    }
    if (showBatch && batchBtnText) {
        html += '<div style="padding:8px 0;"><button class="px-3 py-1 text-xs rounded border" style="border-color:var(--danger);color:var(--danger);background:#fff;" onclick="subTableBatchDelete(\'' + tableId + '\')"><i class="fa fa-trash-o"></i> ' + batchBtnText + '</button></div>';
    }
    html += '<table class="w-full text-sm" style="border-collapse:collapse;"><thead><tr style="background:var(--table-header-bg);">';
    // 记录列 key -> 索引的映射（索引对应实际 td 位置）
    var colKeyMap = {};
    var colIdx = 0;
    columns.forEach(function(col) {
        if (col.type === 'checkbox') {
            colIdx++; // checkbox 也占一个 td 位置
            html += '<th style="padding:8px 12px;border-bottom:1px solid var(--table-border);width:40px;text-align:center;"><input type="checkbox" onchange="subTableSelectAll(\'' + tableId + '\', this.checked)" /></th>';
        } else {
            if (col.key) { colKeyMap[col.key] = colIdx; }
            colIdx++;
            var sortIcon = col.sortable ? '<i class="fa fa-sort ml-1" style="color:var(--text-tertiary);font-size:11px;"></i>' : '';
            html += '<th data-key="' + (col.key || '') + '" style="padding:8px 12px;border-bottom:1px solid var(--table-border);text-align:left;cursor:' + (col.sortable ? 'pointer' : 'default') + ';" ' + (col.sortable ? 'onclick="subTableSort(\'' + tableId + '\', \'' + col.key + '\')"' : '') + '>' + col.title + sortIcon + '</th>';
        }
    });
    html += '</tr></thead><tbody id="' + tableId + '_body" data-colmap="' + encodeURIComponent(JSON.stringify(colKeyMap)) + '">';
    data.forEach(function(row) {
        html += '<tr style="border-bottom:1px solid var(--table-border);" onmouseover="this.style.background=\'var(--table-header-bg)\'" onmouseout="this.style.background=\'#fff\'">';
        columns.forEach(function(col) {
            if (col.type === 'checkbox') {
                html += '<td style="padding:8px 12px;text-align:center;"><input type="checkbox" class="sub-checkbox" data-table="' + tableId + '" /></td>';
            } else if (col.type === 'tag' && col.tagMap) {
                var tagInfo = col.tagMap[row[col.key]];
                if (tagInfo) {
                    var colors = { blue: '#165DFF', green: '#52C41A', orange: '#FA8C16', red: '#FF4D4F', gray: '#999999', teal: '#13C2C2' };
                    var bg = colors[tagInfo.color] || '#999999';
                    html += '<td style="padding:8px 12px;"><span style="padding:2px 8px;border-radius:4px;font-size:12px;color:' + bg + ';background:' + bg + '15;">' + tagInfo.text + '</span></td>';
                } else {
                    html += '<td style="padding:8px 12px;">' + esc(row[col.key]) + '</td>';
                }
            } else {
                html += '<td style="padding:8px 12px;">' + esc(row[col.key]) + '</td>';
            }
        });
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

/** 子表格全选 */

/** 子表格批量删除 */
function subTableBatchDelete(tableId) {
    var body = document.getElementById(tableId + '_body');
    if (!body) return;
    var checked = body.querySelectorAll('.sub-checkbox:checked');
    if (checked.length === 0) { showToast('请先选择要删除的记录', 'warning'); return; }
    checked.forEach(function(cb) {
        var tr = cb.closest('tr');
        if (tr) tr.remove();
    });
    showToast('删除成功，共删除 ' + checked.length + ' 条记录', 'success');
}

/** 子表格排序 */
function subTableSort(tableId, colKey) {
    var body = document.getElementById(tableId + '_body');
    if (!body) return;
    var rows = Array.from(body.querySelectorAll('tr'));
    if (rows.length === 0) return;
    
    // 从 data-colmap 获取列索引映射
    var colMap = {};
    try {
        var raw = body.getAttribute('data-colmap');
        if (raw) { colMap = JSON.parse(decodeURIComponent(raw)); }
    } catch(e) { colMap = {}; }
    
    var colIdx = colMap[colKey];
    if (colIdx === undefined) {
        // 回退：从表头 data-key 属性查找
        var headers = body.parentElement.querySelector('thead tr');
        if (headers) {
            var ths = headers.querySelectorAll('th');
            for (var i = 0; i < ths.length; i++) {
                if (ths[i].getAttribute('data-key') === colKey) { colIdx = i; break; }
            }
        }
    }
    if (colIdx === undefined) return;
    
    var currentDir = body.getAttribute('data-sort-dir') || 'desc';
    var newDir = currentDir === 'asc' ? 'desc' : 'asc';
    body.setAttribute('data-sort-dir', newDir);
    
    rows.sort(function(a, b) {
        var aCells = a.querySelectorAll('td');
        var bCells = b.querySelectorAll('td');
        var aText = aCells[colIdx] ? aCells[colIdx].textContent.trim() : '';
        var bText = bCells[colIdx] ? bCells[colIdx].textContent.trim() : '';
        if (newDir === 'asc') return aText.localeCompare(bText, 'zh');
        return bText.localeCompare(aText, 'zh');
    });
    rows.forEach(function(r) { body.appendChild(r); });
    showToast('已按 ' + colKey + ' ' + (newDir === 'asc' ? '升序' : '降序') + ' 排序', 'info');
}

/** 7. 确认批量删除 */
function confirmBatchDelete(pageKey, modalId) {
    closeModal(modalId);
    const selected = state.selectedRows[pageKey];
    if (!selected) return;
    
    // 检测是否为 tab-table 格式
    let realPageKey = pageKey;
    let tabKey = null;
    let config = pageConfigs[pageKey];
    
    if (!config) {
        for (const pk of Object.keys(pageConfigs)) {
            if (pageKey.startsWith(pk + '_')) {
                realPageKey = pk;
                tabKey = pageKey.substring(pk.length + 1);
                config = pageConfigs[pk];
                break;
            }
        }
    }
    
    if (realPageKey === 'admin-auth') {
        const tab = state.currentTab['admin-auth'];
        config.tabData[tab] = config.tabData[tab].filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderAdminAuthTable();
    } else if (tabKey && config.tabConfigs && config.tabConfigs[tabKey] && config.tabConfigs[tabKey].data) {
        // tab-table 页面（tabConfigs 格式）
        config.tabConfigs[tabKey].data = config.tabConfigs[tabKey].data.filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        const tabCfg = config.tabConfigs[tabKey];
        // 获取过滤后的数据（考虑查询条件）
        let data = config.tabConfigs[tabKey].data.slice();
        const search = state.searchData[pageKey];
        if (search) {
            for (const [key, val] of Object.entries(search)) {
                if (val && val.trim()) {
                    data = data.filter(row => String(row[key] !== undefined ? row[key] : '').toLowerCase().includes(val.toLowerCase()));
                }
            }
        }
        renderTable('tableContainer_' + pageKey, tabCfg.columns, data, pageKey);
        // 更新分页
        const main = $('mainContent');
        const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, data.length);
    } else if (config && config.tabData && tabKey) {
        // tab-table 页面（tabData 格式）
        config.tabData[tabKey] = config.tabData[tabKey].filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderTable('tableContainer_' + pageKey, config.columns, getTabData(realPageKey, tabKey), pageKey);
    } else if (config) {
        config.data = (config.data || []).filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderTable('tableContainer_' + pageKey, config.columns, getPageData(pageKey), pageKey);
    }
    showToast('已删除 ' + selected.size + ' 条记录', 'success');
}

/** 渲染已关联帐号表格 */
function renderLinkedTable() {
    if (!window._transferData) return;
    var tbody = document.getElementById('transfer_right_table_body');
    if (!tbody) return;
    var search = (document.getElementById('transfer_search_right') || {}).value || '';
    var orgFilter = (document.getElementById('transfer_org_filter') || {}).value || '';
    var list = window._transferData.linked.filter(function(item) {
        var matchSearch = !search || item.account.indexOf(search) >= 0 || item.name.indexOf(search) >= 0;
        var matchOrg = !orgFilter || item.org === orgFilter;
        return matchSearch && matchOrg;
    });
    // 排序
    var sortKey = window._transferData.sortKey || 'createTime';
    var sortDir = window._transferData.sortDir || 'desc';
    list.sort(function(a, b) {
        var va = a[sortKey] || '';
        var vb = b[sortKey] || '';
        if (sortDir === 'asc') return String(va).localeCompare(String(vb), 'zh');
        return String(vb).localeCompare(String(va), 'zh');
    });
    var html = '';
    list.forEach(function(item) {
        html += '<tr style="border-bottom:1px solid #F0F0F0;" onmouseover="this.style.background=\'#FAFAFA\'" onmouseout="this.style.background=\'#fff\'">';
        html += '<td style="padding:6px 10px;text-align:center;"><input type="checkbox" class="link-checkbox" value="' + item.id + '" /></td>';
        html += '<td style="padding:6px 10px;">' + esc(item.account) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.name) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.phone) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.org) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.createTime) + '</td>';
        html += '<td style="padding:6px 10px;text-align:center;"><a href="javascript:void(0);" style="color:#FF4D4F;font-size:12px;" onclick="removeOneLinked(' + item.id + ')">移除</a></td>';
        html += '</tr>';
    });
    if (list.length === 0) {
        html = '<tr><td colspan="7" style="padding:24px;text-align:center;color:#999;">暂无已关联帐号</td></tr>';
    }
    tbody.innerHTML = html;
    tbody.style.display = 'table-row-group';
    var countEl = document.getElementById('link_count');
    if (countEl) countEl.textContent = list.length;
}

/** 已关联表格排序 */
function sortLinkedTable(key) {
    if (!window._transferData) return;
    if (window._transferData.sortKey === key) {
        window._transferData.sortDir = window._transferData.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
        window._transferData.sortKey = key;
        window._transferData.sortDir = 'asc';
    }
    renderLinkedTable();
}

/** 全选已关联 */
function linkCheckAll(checked) {
    document.querySelectorAll('.link-checkbox').forEach(function(cb) { cb.checked = checked; });
}

/** 批量移除已关联 */
function batchRemoveLinked() {
    if (!window._transferData) return;
    var ids = [];
    document.querySelectorAll('.link-checkbox:checked').forEach(function(cb) { ids.push(parseInt(cb.value)); });
    if (ids.length === 0) { showToast('请先选择要移除的帐号', 'warning'); return; }
    if (!confirm('确定移除选中的 ' + ids.length + ' 个已关联帐号？')) return;
    window._transferData.linked = window._transferData.linked.filter(function(item) { return ids.indexOf(item.id) < 0; });
    renderLinkedTable();
    renderTransferLists();
    showToast('已移除 ' + ids.length + ' 个帐号', 'success');
}

/** 移除单个已关联 */
function removeOneLinked(id) {
    if (!window._transferData) return;
    if (!confirm('确定移除此帐号？')) return;
    window._transferData.linked = window._transferData.linked.filter(function(item) { return item.id !== id; });
    renderLinkedTable();
    renderTransferLists();
    showToast('移除成功', 'success');
}

/** 穿梭框移到右侧（加入已关联，从待选移除） */
function transferToRight() {
    if (!window._transferData) return;
    var leftList = document.getElementById('transfer_left_list');
    if (!leftList) return;
    var checked = leftList.querySelectorAll('input[type="checkbox"]:checked');
    if (checked.length === 0) { showToast('请先选择待选帐号', 'warning'); return; }
    var movedIds = [];
    checked.forEach(function(cb) {
        var id = parseInt(cb.value);
        var item = window._transferData.available.find(function(a) { return a.id === id; });
        if (item && !window._transferData.linked.find(function(l) { return l.id === id; })) {
            window._transferData.linked.push(item);
            movedIds.push(id);
        }
    });
    // 从待选列表移除
    window._transferData.available = window._transferData.available.filter(function(a) { return movedIds.indexOf(a.id) < 0; });
    renderLinkedTable();
    renderTransferLists();
    showToast('已添加 ' + movedIds.length + ' 个帐号', 'success');
}

/** 穿梭框移到左侧（从已关联移除，放回待选） */
function transferToLeft() {
    if (!window._transferData) return;

    if (ids.length === 0) { showToast('请先在右侧选择要移除的帐号', 'warning'); return; }
    if (!confirm('确定移除选中的 ' + ids.length + ' 个已关联帐号？')) return;
    // 放回待选列表
    ids.forEach(function(id) {
        var item = window._transferData.linked.find(function(l) { return l.id === id; });
        if (item && !window._transferData.available.find(function(a) { return a.id === id; })) {
            window._transferData.available.push(item);
        }
    });
    // 从已关联移除
    window._transferData.linked = window._transferData.linked.filter(function(item) { return ids.indexOf(item.id) < 0; });
    renderLinkedTable();
    renderTransferLists();
    showToast('已移除 ' + ids.length + ' 个帐号', 'success');
}

/** 新增子菜单/子机构弹窗 */
function openAddChildModal(pageKey, rowId) {
    if (pageKey === 'menu') {
        openMenuAddModal(rowId);
        return;
    }
    const config = pageConfigs[pageKey];
    let row;
    if (config.type === 'tree') {
        row = config.treeData.flat(Infinity).find(function(r) { return r.id === rowId; });
        // 深度查找
        function findInTree(nodes) {
            for (var n of nodes) {
                if (n.id === rowId) return n;
                if (n.children) { var f = findInTree(n.children); if (f) return f; }
            }
            return null;
        }
        row = findInTree(config.treeData);
    }
    const parentName = row ? row.name : '';
    const id = 'modal_addchild_' + pageKey;
    const body = `
        <div class="mb-4 p-3 rounded" style="background:#F5F7FA;">
            <span class="text-sm" style="color:var(--text-secondary);">上级：</span>
            <span class="text-sm font-medium">${esc(parentName)}</span>

/** 11. 添加导入文件 */
function addImportFile() {
    var fileName = 'file_' + (window._importFiles.length + 1) + '.xlsx';
    window._importFiles.push({ name: fileName, size: Math.floor(Math.random() * 500 + 100) + 'KB', status: 'pending' });
    renderImportFileList();
}

/** 11. 移除导入文件 */
function removeImportFile(index) {
    window._importFiles.splice(index, 1);
    renderImportFileList();
}

/** 渲染导入文件列表 */
function renderImportFileList() {
    var list = $('import_file_list');
    if (!list) return;
    if (window._importFiles.length === 0) {
        list.innerHTML = '<div class="text-center text-sm py-4" style="color:var(--text-tertiary);" id="import_empty_tip"><i class="fa fa-file-excel-o text-2xl block mb-2"></i>暂未添加任何文件</div>';
        return;
    }
    list.innerHTML = window._importFiles.map(function(file, index) {
        return '<div class="flex items-center justify-between py-2 px-3 rounded mb-1" style="background:#F5F7FA;">' +
            '<div class="flex items-center gap-2">' +
                '<i class="fa fa-file-excel-o" style="color:var(--success);"></i>' +
                '<span class="text-sm">' + esc(file.name) + '</span>' +
                '<span class="text-xs" style="color:var(--text-tertiary);">' + file.size + '</span>' +
                (file.status === 'success' ? '<span class="tag tag-green">导入成功</span>' : '') +
                (file.status === 'error' ? '<span class="tag tag-red">格式不符</span>' : '') +
            '</div>' +
            '<a class="cursor-pointer text-sm" style="color:var(--danger);" onclick="removeImportFile(' + index + ')"><i class="fa fa-times"></i></a>' +
        '</div>';
    }).join('');
}

/** 11. 开始导入 */
function startImport(moduleName, modalId) {
    if (!window._importFiles || window._importFiles.length === 0) {
        showToast('请先添加文件', 'warning');
        return;
    }
    // 模拟导入过程
    window._importFiles.forEach(function(file) {
        file.status = 'success';
    });
    renderImportFileList();
    setTimeout(function() {
        closeModal(modalId);
        showToast('导入完成：' + window._importFiles.length + ' 个文件全部成功', 'success');
        window._importFiles = [];
    }, 1000);
}

/** 获取操作点击处理器 */
function getActionClickHandler(pageKey, actionKey, row) {
    if (pageKey === 'user') {
        if (actionKey === 'detail') {
            return 'openViewModal(\'user\', ' + row.id + ')';
        } else if (actionKey === 'adjustPost') {
            return 'openAdjustPostModal(' + row.id + ')';
        } else if (actionKey === 'editUser') {
            return 'openEditUserModal(' + row.id + ')';
        } else if (actionKey === 'delete') {
            return 'showToast(\'删除用户\',\'warning\')';
        } else {
            return 'showToast(\'' + actionKey + '\',\'info\')';
        }
    }
    return 'showToast(\'' + actionKey + '\',\'info\')';
}

/** 角色权限组关联 - 切换授权类型 */
function switchAuthType(type) {
    var roleSection = document.getElementById('authRoleSection');
    var groupSection = document.getElementById('authRoleGroupSection');
    if (type === 'role') {
        roleSection.style.display = 'block';
        groupSection.style.display = 'none';
    } else {
        roleSection.style.display = 'none';
        groupSection.style.display = 'block';
    }
}

function showToast(message, type) {
    var iconMap = { success: 'fa-check-circle', info: 'fa-info-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle' };
    var colorMap = { success: 'var(--success)', info: 'var(--primary)', error: 'var(--danger)', warning: 'var(--warning)' };
    type = type || 'info';
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = colorMap[type] || colorMap.info;
    toast.innerHTML = '<i class="fa ' + (iconMap[type] || iconMap.info) + '"></i><span>' + esc(message) + '</span>';
    $('toastContainer').appendChild(toast);
    setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s';
        setTimeout(function() { toast.remove(); }, 300);
    }, 3000);
}

/** 切换应用日志 Tab */
function switchAppLogTab(modalId, tabKey, el) {
    var tabs = el.parentElement.children;
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.borderBottomColor = 'transparent';
        tabs[i].style.color = 'var(--text-secondary)';
        tabs[i].style.fontWeight = '400';
    }
    el.style.borderBottomColor = 'var(--primary)';
    el.style.color = 'var(--primary)';
    el.style.fontWeight = '500';
    var opDiv = document.getElementById('logContent_op_' + modalId);
    var subDiv = document.getElementById('logContent_sub_' + modalId);
    if (opDiv && subDiv) {
        opDiv.style.display = tabKey === 'op' ? 'block' : 'none';
        subDiv.style.display = tabKey === 'sub' ? 'block' : 'none';
    }
}

/** 条线用户全选 */
function lineUserSelectAll(checked) {
    document.querySelectorAll('.line-user-cb').forEach(function(cb) { cb.checked = checked; });
    lineUserUpdateSel();
}

/** 条线用户更新选中状态 */
function lineUserUpdateSel() {
    var checked = document.querySelectorAll('.line-user-cb:checked');
    var btn = document.getElementById('lineUserBatchDel');
    var info = document.getElementById('lineUserSelInfo');
    if (btn && info) {
        if (checked.length > 0) {
            btn.disabled = false;
            btn.style.opacity = '1';
            info.textContent = '已选 ' + checked.length + ' 条';
            info.style.color = 'var(--primary)';
        } else {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            info.textContent = '请先选择记录';
            info.style.color = 'var(--text-tertiary)';
        }
    }
}

/** 条线用户批量删除 */
function lineUserBatchDelete() {
    var checked = document.querySelectorAll('.line-user-cb:checked');
    if (checked.length === 0) { showToast('请先选择要删除的用户', 'warning'); return; }
    checked.forEach(function(cb) {
        var tr = cb.closest('tr');
        if (tr) tr.remove();
    });
    showToast('删除成功，共删除 ' + checked.length + ' 条记录', 'success');
    lineUserUpdateSel();
}

/** 条线用户单条删除 */
function lineUserDelete(link) {
    var tr = link.closest('tr');
    if (tr) {
        tr.remove();
        showToast('删除成功', 'success');
        lineUserUpdateSel();
    }
}

/* ============================================================
 * 状态/变更类型 颜色映射
 * ============================================================ */
function getStatusTagClass(status) {
    if (status === '符合') return 'tag-green';
    if (status === '不符合') return 'tag-red';
    if (status === '部分符合') return 'tag-orange';
    return 'tag-gray';
}
function getChangeTypeTagClass(changeType) {
    if (changeType === '新增') return 'tag-blue';
    if (changeType === '功能升级') return 'tag-purple';
    if (changeType === '架构变更') return 'tag-teal';
    if (changeType === '需求变动') return 'tag-orange';
    if (changeType === '实现变更') return 'tag-darkblue';
    return 'tag-gray';
}

/* ============================================================
 * 渲染右侧说明卡片
 * ============================================================ */
function updateDescriptions(pageKey) {
    currentPage = pageKey;
    var container = document.getElementById('descContainer');
    var items = descData[pageKey];
    var prd = prdData[pageKey];
    var pageName = getPageName(pageKey);

    // 更新选择器
    var selector = document.getElementById('pageSelector');
    if (selector) selector.value = pageKey;

    var html = '';

    // PRD 需求说明卡片
    if (prd) {
        html += renderPrdCard(pageKey, pageName, prd);
    } else {
        html += '<div class="empty-state"><i class="fa fa-inbox" style="font-size:28px;display:block;margin-bottom:8px;"></i>该页面暂无PRD说明</div>';
    }
    container.innerHTML = html;
}

function renderPrdCard(pageKey, pageName, prd) {
    var html = '<div class="desc-card" style="border-color:#93C5FD;background:linear-gradient(135deg,#EFF6FF 0%,#FFFFFF 100%);">';
    html += '<div class="desc-card-header" style="border-bottom:1px solid #BFDBFE;padding-bottom:8px;margin-bottom:10px;">';
    html += '<div style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#165DFF;color:#fff;border-radius:4px;font-size:11px;flex-shrink:0;"><i class="fa fa-file-text"></i></div>';
    html += '<div class="desc-title" style="font-size:14px;">PRD需求说明 - ' + pageName + '</div>';
    html += '</div>';
    html += '<div class="desc-section"><div class="desc-label">功能背景</div><div class="desc-text">' + prd.background + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">目标用户</div><div class="desc-text">' + prd.targetUsers + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">核心功能点</div><div class="desc-text">' + prd.coreFeatures + '</div></div>';
    if (prd.dataModel) {
        html += '<div class="desc-section"><div class="desc-label">数据模型</div><div class="desc-text">' + prd.dataModel + '</div></div>';
    }
    html += '<div class="desc-section"><div class="desc-label">业务流程</div><div class="desc-text">' + prd.businessFlow + '</div></div>';
    if (prd.addFlow) {
        html += '<div class="desc-section"><div class="desc-label">新增流程</div><div class="desc-text">' + prd.addFlow + '</div></div>';
    }
    if (prd.editFlow) {
        html += '<div class="desc-section"><div class="desc-label">修改流程</div><div class="desc-text">' + prd.editFlow + '</div></div>';
    }
    if (prd.deleteFlow) {
        html += '<div class="desc-section"><div class="desc-label">删除流程</div><div class="desc-text">' + prd.deleteFlow + '</div></div>';
    }
    if (prd.queryFlow) {
        html += '<div class="desc-section"><div class="desc-label">查询流程</div><div class="desc-text">' + prd.queryFlow + '</div></div>';
    }
    if (prd.sortConfig) {
        html += '<div class="desc-section"><div class="desc-label">排序功能</div><div class="desc-text">' + prd.sortConfig + '</div></div>';
    }
    if (prd.fieldRules) {
        html += '<div class="desc-section"><div class="desc-label">字段规则</div>';
        // 判断是数组形式（单表）还是对象形式（Tab多表）
        if (Array.isArray(prd.fieldRules)) {
            html += renderFieldRulesTable(prd.fieldRules);
        } else if (typeof prd.fieldRules === 'object') {
            // Tab形式，获取tab标签配置
            var tabConfig = pageConfigs[pageKey];
            var tabs = tabConfig && tabConfig.tabs ? tabConfig.tabs : [];
            if (tabs.length > 0) {
                html += '<div class="field-rules-tabs">';
                var firstKey = tabs[0].key;
                // tab头部
                html += '<div class="field-rules-tab-header">';
                for (var ti = 0; ti < tabs.length; ti++) {
                    var tab = tabs[ti];
                    var isActive = ti === 0 ? 'active' : '';
                    html += '<div class="field-rules-tab-item ' + isActive + '" onclick="switchFieldRulesTab(\'' + pageKey + '\',\'' + tab.key + '\',this)">' + tab.label + '</div>';
                }
                html += '</div>';
                // tab内容
                html += '<div class="field-rules-tab-content">';
                for (var tj = 0; tj < tabs.length; tj++) {
                    var tabKey = tabs[tj].key;
                    var rules = prd.fieldRules[tabKey];
                    var isShow = tj === 0 ? 'block' : 'none';
                    html += '<div class="field-rules-tab-pane" data-tab="' + tabKey + '" style="display:' + isShow + ';">';
                    if (rules && rules.length > 0) {
                        html += renderFieldRulesTable(rules);
                    } else {
                        html += '<div style="padding:20px;text-align:center;color:#999;">暂无字段规则</div>';
                    }
                    html += '</div>';
                }
                html += '</div></div>';
            }
        }
        html += '</div>';
    }
    html += '<div class="desc-section"><div class="desc-label">页面信息结构</div><div class="desc-text">' + prd.pageInfo + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">交互逻辑</div><div class="desc-text">' + prd.interaction + '</div></div>';
    if (prd.exceptionHandling) {
        html += '<div class="desc-section"><div class="desc-label">异常处理</div><div class="desc-text">' + prd.exceptionHandling + '</div></div>';
    }
    if (prd.permissionReq) {
        html += '<div class="desc-section"><div class="desc-label">权限要求</div><div class="desc-text">' + prd.permissionReq + '</div></div>';
    }
    html += '<div class="desc-section"><div class="desc-label">验收标准</div><div class="desc-text">' + prd.acceptance + '</div></div>';
    html += '</div>';
    return html;
}

function renderFieldRulesTable(rules) {
    var html = '<table class="field-rules-table">';
    html += '<thead><tr>';
    html += '<th style="width:80px;">字段名称</th>';
    html += '<th style="width:50px;">必填</th>';
    html += '<th style="width:70px;">字段类型</th>';
    html += '<th style="width:50px;">唯一</th>';
    html += '<th style="width:90px;">长度限制</th>';
    html += '<th style="width:120px;">格式/枚举值</th>';
    html += '<th style="width:90px;">默认值</th>';
    html += '<th>说明</th>';
    html += '</tr></thead><tbody>';
    for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        html += '<tr>';
        html += '<td class="fr-field-name">' + r.field + '</td>';
        html += '<td class="fr-required">' + (r.required ? '<span style="color:#F53F3F;font-weight:600;">是</span>' : '否') + '</td>';
        html += '<td class="fr-type">' + r.type + '</td>';
        html += '<td class="fr-unique">' + (r.unique ? '是' : '否') + '</td>';
        html += '<td class="fr-length">' + r.length + '</td>';
        html += '<td class="fr-format">' + r.format + '</td>';
        html += '<td class="fr-default">' + r.defaultValue + '</td>';
        html += '<td class="fr-desc">' + r.desc + '</td>';
        html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

function switchFieldRulesTab(pageKey, tabKey, el) {
    var parent = el.closest('.field-rules-tabs');
    if (!parent) return;
    // 切换tab头部
    var items = parent.querySelectorAll('.field-rules-tab-item');
    for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
    }
    el.classList.add('active');
    // 切换tab内容
    var panes = parent.querySelectorAll('.field-rules-tab-pane');
    for (var j = 0; j < panes.length; j++) {
        if (panes[j].getAttribute('data-tab') === tabKey) {
            panes[j].style.display = 'block';
        } else {
            panes[j].style.display = 'none';
        }
    }
}

function renderDescCard(item) {
    var html = '<div class="desc-card">';
    html += '<div class="desc-card-header">';
    html += '<div class="desc-num">#' + item.id + '</div>';
    html += '<div class="desc-title">' + item.title + '</div>';
    html += '</div>';
    html += '<div class="desc-tags">';
    html += '<span class="tag ' + getStatusTagClass(item.status) + '">' + item.status + '</span>';
    html += '<span class="tag ' + getChangeTypeTagClass(item.changeType) + '">' + item.changeType + '</span>';
    html += '</div>';
    html += '<div class="desc-section"><div class="desc-label">走查说明</div><div class="desc-text">' + item.walkthroughDesc + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">业务规则</div><div class="desc-text">' + item.rules + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">原型实现</div><div class="desc-text">' + item.implementation + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">验收标准</div><div class="desc-text">' + item.acceptance + '</div></div>';
    html += '</div>';
    return html;
}

function getPageName(key) {
    for (var i = 0; i < pageList.length; i++) {
        if (pageList[i].key === key) return pageList[i].name;
    }
    return key;
}

/* ============================================================
 * 页面选择器初始化
 * ============================================================ */
function initPageSelector() {
    var selector = document.getElementById('pageSelector');
    var html = '';
    var currentGroup = '';
    for (var i = 0; i < pageList.length; i++) {
        var p = pageList[i];
        if (p.group && p.group !== currentGroup) {
            if (currentGroup) html += '</optgroup>';
            currentGroup = p.group;
            html += '<optgroup label="' + currentGroup + '">';
        } else if (!p.group && currentGroup) {
            html += '</optgroup>';
            currentGroup = '';
        }
        html += '<option value="' + p.key + '">' + p.name + '</option>';
    }
    if (currentGroup) html += '</optgroup>';
    selector.innerHTML = html;
    selector.value = currentPage;
}

/* ============================================================
 * 选择器手动切换
 * ============================================================ */
function onSelectorChange(pageKey) {
    updateDescriptions(pageKey);
    switchPage(pageKey);
}

/* ============================================================
 * 右侧面板折叠/展开
 * ============================================================ */
function toggleRightPanel() {
    var container = document.getElementById('appContainer');
    var expandBtn = document.getElementById('expandBtn');
    var collapseBtn = document.getElementById('collapseBtn');
    if (container.classList.contains('collapsed')) {
        container.classList.remove('collapsed');
        expandBtn.classList.remove('show');
        collapseBtn.style.display = 'flex';
    } else {
        container.classList.add('collapsed');
        expandBtn.classList.add('show');
        collapseBtn.style.display = 'none';
    }
}

/* postMessage listener removed - using direct function calls instead */

/* Polling removed - using direct function calls instead */

/* onFrameLoad removed - no iframe */

/* ============================================================
 * 初始化
 * ============================================================ */
function initCompare() {
    // 检查URL参数，支持 ?page=xxx 直接跳转到指定页面
    var urlParams = new URLSearchParams(window.location.search);
    var targetPage = urlParams.get('page');
    if (targetPage && pageConfigs[targetPage]) {
        switchPage(targetPage);
    } else {
        // 默认渲染首页
        renderSidebar();
        renderPage(currentPage);
    }
    initPageSelector();
    updateDescriptions(currentPage);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCompare);
} else {
    initCompare();
}
</script>
