/** 显示机构下拉列表 */
function showDeputyOrgList() {
    var dropdown = document.getElementById('deputy_orgDropdown');
    if (dropdown) dropdown.style.display = 'block';
    filterDeputyOrgList(document.getElementById('deputy_orgName').value);
}

/** 延迟隐藏机构下拉列表（允许点击选择） */
function hideDeputyOrgListDelayed() {
    setTimeout(function() {
        var dropdown = document.getElementById('deputy_orgDropdown');
        if (dropdown) dropdown.style.display = 'none';
    }, 200);
}

/** 过滤机构下拉列表 */
function filterDeputyOrgList(keyword) {
    var dropdown = document.getElementById('deputy_orgDropdown');
    var list = document.getElementById('deputy_orgList');
    if (!dropdown || !list) return;
    dropdown.style.display = 'block';
    var items = list.querySelectorAll('.deputy-org-item');
    var kw = keyword.toLowerCase();
    for (var i = 0; i < items.length; i++) {
        var name = items[i].getAttribute('data-name') || '';
        if (name.toLowerCase().indexOf(kw) >= 0) {
            items[i].style.display = '';
        } else {
            items[i].style.display = 'none';
        }
    }
}

/** 选择机构 */
function selectDeputyOrg(orgName) {
    var input = document.getElementById('deputy_orgName');
    if (input) input.value = orgName;
    var dropdown = document.getElementById('deputy_orgDropdown');
    if (dropdown) dropdown.style.display = 'none';
    showToast('已选择：' + orgName, 'info');
}

/** 确认添加副职 */
function confirmAddDeputyDuty(modalId, viewModalId) {

/** 刷新调整任职弹窗的所属机构列表 */
function refreshPostList(userId) {
    var modalId = 'modal_adjust_post_' + userId;
    var modal = document.getElementById(modalId);
    if (!modal) return;

    // 重新打开弹窗（保留Tab状态太复杂，直接重新渲染）
    var wasOrgTab = modal.querySelector('#edit_user_tab_org_' + modalId).style.display !== 'none';
    closeModal(modalId);
    openAdjustPostModal(userId);
    if (wasOrgTab) {
        setTimeout(function() {
            var tabs = document.querySelectorAll('#' + modalId + ' .edit-user-tab');
            if (tabs.length >= 2) tabs[1].click();
        }, 50);
    }
}

/** 单条解职确认 */
function confirmRemovePost(userId, postId) {
    var posts = (userLayoutState.userPosts && userLayoutState.userPosts[userId]) || [];
    var post = posts.find(function(p) { return p.id === postId; });
    if (!post) return;

    var id = 'modal_confirm_remove_post_' + postId;
    var body = '<div style="padding:10px 0;">';
    body += '<div style="display:flex;align-items:flex-start;gap:12px;">';
    body += '<i class="fa fa-exclamation-triangle" style="font-size:28px;color:#FAAD14;"></i>';
    body += '<div>';
    body += '<div class="text-base font-medium mb-2" style="color:var(--text-primary);">确认解职？</div>';
    body += '<div class="text-sm" style="color:var(--text-secondary);line-height:1.6;">';
    body += '确定要将用户从 <b style="color:var(--text-primary);">' + esc(post.orgName) + '</b> 解职吗？';
    body += '<br/>解职后该任职记录将被移除，此操作不可撤销。';

    var footer = '<button class="btn btn-default btn-sm" onclick="closeModal(\'' + id + '\')">取消</button>';

    openModal(id, '解职确认', body, footer, 'normal');
}

/** 执行解职 */
function doRemovePost(userId, postId, confirmModalId) {
    closeModal(confirmModalId);
    var posts = userLayoutState.userPosts[userId] || [];
    userLayoutState.userPosts[userId] = posts.filter(function(p) { return p.id !== postId; });
    showToast('解职成功', 'success');
    refreshPostList(userId);
}

/** 批量解职 */
function batchRemovePost(userId) {
    var modal = document.getElementById('modal_adjust_post_' + userId);
    if (!modal) return;
    var checkboxes = modal.querySelectorAll('.post-checkbox:checked');
    var ids = [];
    for (var i = 0; i < checkboxes.length; i++) {
        ids.push(parseInt(checkboxes[i].value));
    }
    if (ids.length === 0) {
        showToast('请先选择要解职的任职记录', 'warning');
        return;
    }

    var id = 'modal_batch_remove_post_' + userId;
    var body = '<div style="padding:10px 0;">';
    body += '<div style="display:flex;align-items:flex-start;gap:12px;">';
    body += '<i class="fa fa-exclamation-triangle" style="font-size:28px;color:#FAAD14;"></i>';
    body += '<div>';
    body += '<div class="text-base font-medium mb-2" style="color:var(--text-primary);">确认批量解职？</div>';
    body += '<div class="text-sm" style="color:var(--text-secondary);line-height:1.6;">';
    body += '确定要将选中的 <b style="color:var(--text-primary);">' + ids.length + '</b> 条任职记录解职吗？';
    body += '<br/>解职后这些任职记录将被移除，此操作不可撤销。';
    body += '</div></div></div></div>';

    var footer = '<button class="btn btn-default btn-sm" onclick="closeModal(\'' + id + '\')">取消</button>';
    footer += '<button class="btn btn-danger btn-sm" onclick="doBatchRemovePost(' + userId + ', \'' + id + '\')">确认解职</button>';

    openModal(id, '批量解职确认', body, footer, 'normal');
}

/** 执行批量解职 */
function doBatchRemovePost(userId, confirmModalId) {
    closeModal(confirmModalId);
    var modal = document.getElementById('modal_adjust_post_' + userId);
    if (!modal) return;
    var checkboxes = modal.querySelectorAll('.post-checkbox:checked');
    var ids = [];
    for (var i = 0; i < checkboxes.length; i++) {
        ids.push(parseInt(checkboxes[i].value));
    }
    var posts = userLayoutState.userPosts[userId] || [];
    userLayoutState.userPosts[userId] = posts.filter(function(p) { return ids.indexOf(p.id) === -1; });
    showToast('批量解职成功，共解职 ' + ids.length + ' 条', 'success');
    refreshPostList(userId);
}

/** 子表格渲染（用户详情Tab内使用） */
function renderSubTable(data, columns, tableId, batchBtnText, showBatch) {
    var html = '';
    if (!data || !Array.isArray(data) || data.length === 0) {
        return '<div style="padding:24px;text-align:center;color:var(--text-tertiary);">暂无数据</div>';
    }
    if (!columns || !Array.isArray(columns)) {
        return '<div style="padding:24px;text-align:center;color:var(--text-tertiary);">列配置异常</div>';
    }
    if (showBatch && batchBtnText) {
        html += '<div style="padding:8px 0;"><button class="px-3 py-1 text-xs rounded border" style="border-color:var(--danger);color:var(--danger);background:#fff;" onclick="subTableBatchDelete(\'' + tableId + '\')"><i class="fa fa-trash-o"></i> ' + batchBtnText + '</button></div>';
    }
    html += '<table class="w-full text-sm" style="border-collapse:collapse;"><thead><tr style="background:var(--table-header-bg);">';
    // 记录列 key -> 索引的映射（索引对应实际 td 位置）
    var colKeyMap = {};
    var colIdx = 0;
    columns.forEach(function(col) {
        if (col.type === 'checkbox') {
            colIdx++; // checkbox 也占一个 td 位置
            html += '<th style="padding:8px 12px;border-bottom:1px solid var(--table-border);width:40px;text-align:center;"><input type="checkbox" onchange="subTableSelectAll(\'' + tableId + '\', this.checked)" /></th>';
        } else {
            if (col.key) { colKeyMap[col.key] = colIdx; }
            colIdx++;
            var sortIcon = col.sortable ? '<i class="fa fa-sort ml-1" style="color:var(--text-tertiary);font-size:11px;"></i>' : '';
            html += '<th data-key="' + (col.key || '') + '" style="padding:8px 12px;border-bottom:1px solid var(--table-border);text-align:left;cursor:' + (col.sortable ? 'pointer' : 'default') + ';" ' + (col.sortable ? 'onclick="subTableSort(\'' + tableId + '\', \'' + col.key + '\')"' : '') + '>' + col.title + sortIcon + '</th>';
        }
    });
    html += '</tr></thead><tbody id="' + tableId + '_body" data-colmap="' + encodeURIComponent(JSON.stringify(colKeyMap)) + '">';
    data.forEach(function(row) {
        html += '<tr style="border-bottom:1px solid var(--table-border);" onmouseover="this.style.background=\'var(--table-header-bg)\'" onmouseout="this.style.background=\'#fff\'">';
        columns.forEach(function(col) {
            if (col.type === 'checkbox') {
                html += '<td style="padding:8px 12px;text-align:center;"><input type="checkbox" class="sub-checkbox" data-table="' + tableId + '" /></td>';
            } else if (col.type === 'tag' && col.tagMap) {
                var tagInfo = col.tagMap[row[col.key]];
                if (tagInfo) {
                    var colors = { blue: '#165DFF', green: '#52C41A', orange: '#FA8C16', red: '#FF4D4F', gray: '#999999', teal: '#13C2C2' };
                    var bg = colors[tagInfo.color] || '#999999';
                    html += '<td style="padding:8px 12px;"><span style="padding:2px 8px;border-radius:4px;font-size:12px;color:' + bg + ';background:' + bg + '15;">' + tagInfo.text + '</span></td>';
                } else {
                    html += '<td style="padding:8px 12px;">' + esc(row[col.key]) + '</td>';
                }
            } else {
                html += '<td style="padding:8px 12px;">' + esc(row[col.key]) + '</td>';
            }
        });
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

/** 子表格全选 */
function subTableSelectAll(tableId, checked) {
    var body = document.getElementById(tableId + '_body');
    if (!body) return;
    body.querySelectorAll('.sub-checkbox').forEach(function(cb) { cb.checked = checked; });
}

/** 子表格批量删除 */
function subTableBatchDelete(tableId) {
    var body = document.getElementById(tableId + '_body');
    if (!body) return;
    var checked = body.querySelectorAll('.sub-checkbox:checked');
    if (checked.length === 0) { showToast('请先选择要删除的记录', 'warning'); return; }
    checked.forEach(function(cb) {
        var tr = cb.closest('tr');
        if (tr) tr.remove();
    });
    showToast('删除成功，共删除 ' + checked.length + ' 条记录', 'success');
}

/** 子表格排序 */
function subTableSort(tableId, colKey) {
    var body = document.getElementById(tableId + '_body');
    if (!body) return;
    var rows = Array.from(body.querySelectorAll('tr'));
    if (rows.length === 0) return;
    
    // 从 data-colmap 获取列索引映射
    var colMap = {};
    try {
        var raw = body.getAttribute('data-colmap');
        if (raw) { colMap = JSON.parse(decodeURIComponent(raw)); }
    } catch(e) { colMap = {}; }
    
    var colIdx = colMap[colKey];
    if (colIdx === undefined) {
        // 回退：从表头 data-key 属性查找
        var headers = body.parentElement.querySelector('thead tr');
        if (headers) {
            var ths = headers.querySelectorAll('th');
            for (var i = 0; i < ths.length; i++) {
                if (ths[i].getAttribute('data-key') === colKey) { colIdx = i; break; }
            }
        }
    }
    if (colIdx === undefined) return;
    
    var currentDir = body.getAttribute('data-sort-dir') || 'desc';
    var newDir = currentDir === 'asc' ? 'desc' : 'asc';
    body.setAttribute('data-sort-dir', newDir);
    
    rows.sort(function(a, b) {
        var aCells = a.querySelectorAll('td');
        var bCells = b.querySelectorAll('td');
        var aText = aCells[colIdx] ? aCells[colIdx].textContent.trim() : '';
        var bText = bCells[colIdx] ? bCells[colIdx].textContent.trim() : '';
        if (newDir === 'asc') return aText.localeCompare(bText, 'zh');
        return bText.localeCompare(aText, 'zh');
    });
    rows.forEach(function(r) { body.appendChild(r); });
    showToast('已按 ' + colKey + ' ' + (newDir === 'asc' ? '升序' : '降序') + ' 排序', 'info');
}

/** 7. 确认批量删除 */
function confirmBatchDelete(pageKey, modalId) {
    closeModal(modalId);
    const selected = state.selectedRows[pageKey];
    if (!selected) return;
    
    // 检测是否为 tab-table 格式
    let realPageKey = pageKey;
    let tabKey = null;
    let config = pageConfigs[pageKey];
    
    if (!config) {
        for (const pk of Object.keys(pageConfigs)) {
            if (pageKey.startsWith(pk + '_')) {
                realPageKey = pk;
                tabKey = pageKey.substring(pk.length + 1);
                config = pageConfigs[pk];
                break;
            }
        }
    }
    
    if (realPageKey === 'admin-auth') {
        const tab = state.currentTab['admin-auth'];
        config.tabData[tab] = config.tabData[tab].filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderAdminAuthTable();
    } else if (tabKey && config.tabConfigs && config.tabConfigs[tabKey] && config.tabConfigs[tabKey].data) {
        // tab-table 页面（tabConfigs 格式）
        config.tabConfigs[tabKey].data = config.tabConfigs[tabKey].data.filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        const tabCfg = config.tabConfigs[tabKey];
        // 获取过滤后的数据（考虑查询条件）
        let data = config.tabConfigs[tabKey].data.slice();
        const search = state.searchData[pageKey];
        if (search) {
            for (const [key, val] of Object.entries(search)) {
                if (val && val.trim()) {
                    data = data.filter(row => String(row[key] !== undefined ? row[key] : '').toLowerCase().includes(val.toLowerCase()));
                }
            }
        }
        renderTable('tableContainer_' + pageKey, tabCfg.columns, data, pageKey);
        // 更新分页
        const main = $('mainContent');
        const oldPagi = main.querySelector('.flex.flex-wrap.items-center.justify-between.gap-4');
        if (oldPagi) oldPagi.outerHTML = renderPagination(pageKey, data.length);
    } else if (config && config.tabData && tabKey) {
        // tab-table 页面（tabData 格式）
        config.tabData[tabKey] = config.tabData[tabKey].filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderTable('tableContainer_' + pageKey, config.columns, getTabData(realPageKey, tabKey), pageKey);
    } else if (config) {
        config.data = (config.data || []).filter(r => !selected.has(r.id));
        state.selectedRows[pageKey] = new Set();
        renderTable('tableContainer_' + pageKey, config.columns, getPageData(pageKey), pageKey);
    }
    showToast('已删除 ' + selected.size + ' 条记录', 'success');
}

        return matchSearch && matchOrg;
    });
    // 排序
    var sortKey = window._transferData.sortKey || 'createTime';
    var sortDir = window._transferData.sortDir || 'desc';
    list.sort(function(a, b) {
        var va = a[sortKey] || '';
        var vb = b[sortKey] || '';
        if (sortDir === 'asc') return String(va).localeCompare(String(vb), 'zh');
        return String(vb).localeCompare(String(va), 'zh');
    });
    var html = '';
    list.forEach(function(item) {
        html += '<tr style="border-bottom:1px solid #F0F0F0;" onmouseover="this.style.background=\'#FAFAFA\'" onmouseout="this.style.background=\'#fff\'">';
        html += '<td style="padding:6px 10px;text-align:center;"><input type="checkbox" class="link-checkbox" value="' + item.id + '" /></td>';
        html += '<td style="padding:6px 10px;">' + esc(item.account) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.name) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.phone) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.org) + '</td>';
        html += '<td style="padding:6px 10px;">' + esc(item.createTime) + '</td>';
        html += '<td style="padding:6px 10px;text-align:center;"><a href="javascript:void(0);" style="color:#FF4D4F;font-size:12px;" onclick="removeOneLinked(' + item.id + ')">移除</a></td>';
        html += '</tr>';
    });
    if (list.length === 0) {
        html = '<tr><td colspan="7" style="padding:24px;text-align:center;color:#999;">暂无已关联帐号</td></tr>';
    }
    tbody.innerHTML = html;
    tbody.style.display = 'table-row-group';
    var countEl = document.getElementById('link_count');
    if (countEl) countEl.textContent = list.length;
}

/** 新增子菜单/子机构弹窗 */
function openAddChildModal(pageKey, rowId) {
    if (pageKey === 'menu') {
        openMenuAddModal(rowId);
        return;
    }
    const config = pageConfigs[pageKey];
    let row;
    if (config.type === 'tree') {
        row = config.treeData.flat(Infinity).find(function(r) { return r.id === rowId; });
        // 深度查找
        function findInTree(nodes) {
            for (var n of nodes) {
                if (n.id === rowId) return n;
                if (n.children) { var f = findInTree(n.children); if (f) return f; }
            }
            return null;
        }
        row = findInTree(config.treeData);
    }
    const parentName = row ? row.name : '';
    const id = 'modal_addchild_' + pageKey;
    const body = `
        <div class="mb-4 p-3 rounded" style="background:#F5F7FA;">

function showToast(message, type) {
    var iconMap = { success: 'fa-check-circle', info: 'fa-info-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle' };
    var colorMap = { success: 'var(--success)', info: 'var(--primary)', error: 'var(--danger)', warning: 'var(--warning)' };
    type = type || 'info';
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = colorMap[type] || colorMap.info;
    toast.innerHTML = '<i class="fa ' + (iconMap[type] || iconMap.info) + '"></i><span>' + esc(message) + '</span>';
    $('toastContainer').appendChild(toast);
    setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';

/** 切换应用日志 Tab */
function switchAppLogTab(modalId, tabKey, el) {
    var tabs = el.parentElement.children;
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.borderBottomColor = 'transparent';
        tabs[i].style.color = 'var(--text-secondary)';
        tabs[i].style.fontWeight = '400';
    }
    el.style.borderBottomColor = 'var(--primary)';
    el.style.color = 'var(--primary)';
    el.style.fontWeight = '500';
    var opDiv = document.getElementById('logContent_op_' + modalId);
    var subDiv = document.getElementById('logContent_sub_' + modalId);
    if (opDiv && subDiv) {
        opDiv.style.display = tabKey === 'op' ? 'block' : 'none';
        subDiv.style.display = tabKey === 'sub' ? 'block' : 'none';
    }
}

/** 条线用户全选 */
function lineUserSelectAll(checked) {
    document.querySelectorAll('.line-user-cb').forEach(function(cb) { cb.checked = checked; });
    lineUserUpdateSel();
}

/** 条线用户更新选中状态 */
function lineUserUpdateSel() {
    var checked = document.querySelectorAll('.line-user-cb:checked');
    var btn = document.getElementById('lineUserBatchDel');
    var info = document.getElementById('lineUserSelInfo');
    if (btn && info) {
        if (checked.length > 0) {
            btn.disabled = false;
            btn.style.opacity = '1';
            info.textContent = '已选 ' + checked.length + ' 条';
            info.style.color = 'var(--primary)';
        } else {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            info.textContent = '请先选择记录';
            info.style.color = 'var(--text-tertiary)';
        }
    }
}

/** 条线用户批量删除 */
function lineUserBatchDelete() {
    var checked = document.querySelectorAll('.line-user-cb:checked');
    if (checked.length === 0) { showToast('请先选择要删除的用户', 'warning'); return; }
    checked.forEach(function(cb) {
        var tr = cb.closest('tr');
        if (tr) tr.remove();
    });
    showToast('删除成功，共删除 ' + checked.length + ' 条记录', 'success');
    lineUserUpdateSel();
}

/** 条线用户单条删除 */
function lineUserDelete(link) {
    var tr = link.closest('tr');
    if (tr) {
        tr.remove();
        showToast('删除成功', 'success');
        lineUserUpdateSel();
    }
}

/* ============================================================
 * 状态/变更类型 颜色映射
 * ============================================================ */
function getStatusTagClass(status) {
    if (status === '符合') return 'tag-green';
    if (status === '不符合') return 'tag-red';
    if (status === '部分符合') return 'tag-orange';
    return 'tag-gray';
}
function getChangeTypeTagClass(changeType) {
    if (changeType === '新增') return 'tag-blue';
    if (changeType === '功能升级') return 'tag-purple';
    if (changeType === '架构变更') return 'tag-teal';
    if (changeType === '需求变动') return 'tag-orange';
    if (changeType === '实现变更') return 'tag-darkblue';
    return 'tag-gray';
}

/* ============================================================

function updateDescriptions(pageKey) {
    currentPage = pageKey;
    var container = document.getElementById('descContainer');
    var items = descData[pageKey];
    var prd = prdData[pageKey];
    var pageName = getPageName(pageKey);

    // 更新选择器
    var selector = document.getElementById('pageSelector');
    if (selector) selector.value = pageKey;

    var html = '';

    // PRD 需求说明卡片
    if (prd) {
        html += renderPrdCard(pageKey, pageName, prd);
    } else {
        html += '<div class="empty-state"><i class="fa fa-inbox" style="font-size:28px;display:block;margin-bottom:8px;"></i>该页面暂无PRD说明</div>';
    }
    container.innerHTML = html;
}

    }
    function renderSection(field, label, text) {
        if (!text) return '';
        return '<div class="desc-section"><div class="desc-label" ' + redStyle(field) + '>' + label + '</div><div class="desc-text" ' + redStyle(field) + '>' + text + '</div></div>';

    var html = '<div class="desc-card" style="border-color:#93C5FD;background:linear-gradient(135deg,#EFF6FF 0%,#FFFFFF 100%);">';

                    html += '</div>';
                }
                html += '</div></div>';
            }
        }
        html += '</div>';
    }
    html += '<div class="desc-section"><div class="desc-label">页面信息结构</div><div class="desc-text">' + prd.pageInfo + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">交互逻辑</div><div class="desc-text">' + prd.interaction + '</div></div>';
    if (prd.exceptionHandling) {
        html += '<div class="desc-section"><div class="desc-label">异常处理</div><div class="desc-text">' + prd.exceptionHandling + '</div></div>';
    }
    if (prd.permissionReq) {
        html += '<div class="desc-section"><div class="desc-label">权限要求</div><div class="desc-text">' + prd.permissionReq + '</div></div>';
    }
    html += '<div class="desc-section"><div class="desc-label">验收标准</div><div class="desc-text">' + prd.acceptance + '</div></div>';
    html += '</div>';
    return html;
}

function renderFieldRulesTable(rules) {
    var html = '<table class="field-rules-table">';
    html += '<thead><tr>';
    html += '<th style="width:80px;">字段名称</th>';
    html += '<th style="width:50px;">必填</th>';
    html += '<th style="width:70px;">字段类型</th>';
    html += '<th style="width:50px;">唯一</th>';
    html += '<th style="width:90px;">长度限制</th>';
    html += '<th style="width:120px;">格式/枚举值</th>';
    html += '<th style="width:90px;">默认值</th>';
    html += '<th>说明</th>';
    html += '</tr></thead><tbody>';
    for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        html += '<tr>';
        html += '<td class="fr-field-name">' + r.field + '</td>';
        html += '<td class="fr-required">' + (r.required ? '<span style="color:#F53F3F;font-weight:600;">是</span>' : '否') + '</td>';
        html += '<td class="fr-type">' + r.type + '</td>';
        html += '<td class="fr-unique">' + (r.unique ? '是' : '否') + '</td>';
        html += '<td class="fr-length">' + r.length + '</td>';
        html += '<td class="fr-format">' + r.format + '</td>';
        html += '<td class="fr-default">' + r.defaultValue + '</td>';
        html += '<td class="fr-desc">' + r.desc + '</td>';
        html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

function switchFieldRulesTab(pageKey, tabKey, el) {
    var parent = el.closest('.field-rules-tabs');
    if (!parent) return;
    // 切换tab头部
    var items = parent.querySelectorAll('.field-rules-tab-item');
    for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
    }
    el.classList.add('active');
    // 切换tab内容
    var panes = parent.querySelectorAll('.field-rules-tab-pane');
    for (var j = 0; j < panes.length; j++) {
        if (panes[j].getAttribute('data-tab') === tabKey) {
            panes[j].style.display = 'block';
        } else {
            panes[j].style.display = 'none';
        }
    }
}

function renderDescCard(item) {
    var html = '<div class="desc-card">';
    html += '<div class="desc-card-header">';
    html += '<div class="desc-num">#' + item.id + '</div>';
    html += '<div class="desc-title">' + item.title + '</div>';
    html += '</div>';
    html += '<div class="desc-tags">';
    html += '<span class="tag ' + getStatusTagClass(item.status) + '">' + item.status + '</span>';
    html += '<span class="tag ' + getChangeTypeTagClass(item.changeType) + '">' + item.changeType + '</span>';
    html += '</div>';
    html += '<div class="desc-section"><div class="desc-label">走查说明</div><div class="desc-text">' + item.walkthroughDesc + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">业务规则</div><div class="desc-text">' + item.rules + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">原型实现</div><div class="desc-text">' + item.implementation + '</div></div>';
    html += '<div class="desc-section"><div class="desc-label">验收标准</div><div class="desc-text">' + item.acceptance + '</div></div>';
    html += '</div>';
    return html;
}

function getPageName(key) {
    for (var i = 0; i < pageList.length; i++) {
        if (pageList[i].key === key) return pageList[i].name;
    }
    return key;
}

/* ============================================================
 * 页面选择器初始化
 * ============================================================ */
function initPageSelector() {
    var selector = document.getElementById('pageSelector');
    var html = '';
    var currentGroup = '';
    for (var i = 0; i < pageList.length; i++) {
        var p = pageList[i];
        if (p.group && p.group !== currentGroup) {
            if (currentGroup) html += '</optgroup>';
            currentGroup = p.group;
            html += '<optgroup label="' + currentGroup + '">';
        } else if (!p.group && currentGroup) {
            html += '</optgroup>';
            currentGroup = '';
        }
        html += '<option value="' + p.key + '">' + p.name + '</option>';
    }
    if (currentGroup) html += '</optgroup>';
    selector.innerHTML = html;
    selector.value = currentPage;
}

/* ============================================================
 * 选择器手动切换
 * ============================================================ */
function onSelectorChange(pageKey) {
    updateDescriptions(pageKey);
    switchPage(pageKey);
}

/* ============================================================
 * 右侧面板折叠/展开
 * ============================================================ */
function toggleRightPanel() {
    var container = document.getElementById('appContainer');
    var expandBtn = document.getElementById('expandBtn');
    var collapseBtn = document.getElementById('collapseBtn');
    if (container.classList.contains('collapsed')) {
        container.classList.remove('collapsed');
        expandBtn.classList.remove('show');
        collapseBtn.style.display = 'flex';
    } else {
        container.classList.add('collapsed');
        expandBtn.classList.add('show');
        collapseBtn.style.display = 'none';
    }
}

/* postMessage listener removed - using direct function calls instead */

/* Polling removed - using direct function calls instead */

/* onFrameLoad removed - no iframe */

/* ============================================================
 * 初始化
 * ============================================================ */
function initCompare() {
    // 检查URL参数，支持 ?page=xxx 直接跳转到指定页面
    var urlParams = new URLSearchParams(window.location.search);
    var targetPage = urlParams.get('page');
    if (targetPage && pageConfigs[targetPage]) {
        switchPage(targetPage);
    } else {
        // 默认渲染首页
        renderSidebar();
        renderPage(currentPage);
    }
    initPageSelector();
    updateDescriptions(currentPage);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCompare);
} else {
    initCompare();
}
</script>
